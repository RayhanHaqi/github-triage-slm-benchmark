name: 02-lfm2.5-1.2b-instruct
description: 'Frozen VS Code issue benchmark: LFM2.5-1.2B-Instruct'
paths:
  data_dir: data
  runs_dir: runs
sources:
  bug:
    github_label: bug
    repo: microsoft/vscode
    file: /home/tilakoid/github-triage-data/bugs.json
  feature-request:
    github_label: feature-request
    repo: microsoft/vscode
    file: /home/tilakoid/github-triage-data/features.json
cleaning:
  max_examples_per_class: 1000
  min_visible_chars: 5
  title_patterns:
  - pattern: ^\s*\[\s*bug\s*\]\s*[:\-]?\s*
    flags: i
    replacement: ''
  - pattern: ^\s*bug\s*[:\-]\s*
    flags: i
    replacement: ''
  - pattern: ^\s*\[\s*feature(?:\s+request)?\s*\]\s*[:\-]?\s*
    flags: i
    replacement: ''
  - pattern: ^\s*feature\s+request\s*[:\-]\s*
    flags: i
    replacement: ''
  - pattern: ^\s*\[\s*needs?\s+more\s+info(?:rmation)?\s*\]\s*[:\-]?\s*
    flags: i
    replacement: ''
  - pattern: ^\s*needs?\s+more\s+info(?:rmation)?\s*[:\-]\s*
    flags: i
    replacement: ''
  body_patterns:
  - pattern: <!--.*?-->
    flags: s
    replacement: ''
  - pattern: (?im)^#{1,6}\s*(?:issue\s+)?type\s*$\n+\s*(?:bug|feature(?:\s+request)?|needs?\s+more\s+info(?:rmation)?)\s*$
    flags: ''
    replacement: ''
  - pattern: (?im)^\s*(?:\*\*)?(?:issue\s+)?type(?:\*\*)?\s*:\s*(?:bug|feature(?:\s+request)?|needs?\s+more\s+info(?:rmation)?)\s*$
    flags: ''
    replacement: ''
  - pattern: \n{4,}
    flags: ''
    replacement: '



      '
  whitespace_pattern: \s+
  duplicate_key_lowercase: true
split:
  train_ratio: 0.8
  val_ratio: 0.9
  temporal_key: created_at
  seed: 42
model:
  base_model: LiquidAI/LFM2.5-1.2B-Instruct
  system_prompt: 'Classify the GitHub issue into exactly one category: bug or feature-request.
    Return only the category name.'
  max_seq_length: 2048
  load_in_4bit: false
  revision: 0f604ada3f766f9f257460c4c9f0b5d6f69d431b
  kind: language
  trust_remote_code: false
  use_exact_model_name: true
lora:
  r: 16
  alpha: 32
  dropout: 0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - out_proj
  - in_proj
  - w1
  - w2
  - w3
  bias: none
  gradient_checkpointing: unsloth
  random_state: 42
training:
  output_subdir: trainer
  adapter_subdir: adapter
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 0.0002
  warmup_ratio: 0.05
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  bf16: true
  fp16: false
  optim: adamw_8bit
  weight_decay: 0.01
  lr_scheduler_type: cosine
  seed: 42
  report_to: none
  vision_collator: false
evaluation:
  split: test
  max_user_tokens: 1800
  max_new_tokens: 12
  do_sample: false
  pad_eos: true
  chat_template_kwargs: {}
benchmark:
  display_name: LFM2.5-1.2B-Instruct
  official_checkpoint: LiquidAI/LFM2.5-1.2B-Instruct
  pinned_revision: 0f604ada3f766f9f257460c4c9f0b5d6f69d431b
  method: LoRA, full BF16 base weights (no quantization)
  compatibility_notes: FastLanguageModel; official repo forced; native LFM2 attention/conv/MLP
    targets; BF16.
