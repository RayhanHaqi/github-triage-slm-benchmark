name: 03-qwen3.5-9b
description: 'Frozen VS Code issue benchmark: Qwen3.5-9B (QLoRA NF4).'
paths:
  data_dir: /home/tilakoid/slm-specialist/data
  runs_dir: /home/tilakoid/slm-specialist/runs
sources:
