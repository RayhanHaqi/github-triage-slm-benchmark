cleaning:
  max_examples_per_class: 1000
  min_visible_chars: 5
  title_patterns:
  - pattern: ^\s*\[\s*bug\s*\]\s*[:\-]?\s*
    flags: i
    replacement: ''
  - pattern: ^\s*bug\s*[:\-]\s*
    flags: i
    replacement: ''
  - pattern: ^\s*\[\s*feature(?:\s+request)?\s*\]\s*[:\-]?\s*
    flags: i
    replacement: ''
  - pattern: ^\s*feature\s+request\s*[:\-]\s*
    flags: i
    replacement: ''
  - pattern: ^\s*\[\s*needs?\s+more\s+info(?:rmation)?\s*\]\s*[:\-]?\s*
    flags: i
    replacement: ''
  - pattern: ^\s*needs?\s+more\s+info(?:rmation)?\s*[:\-]\s*
    flags: i
    replacement: ''
  body_patterns:
  - pattern: <!--.*?-->
    flags: s
    replacement: ''
  - pattern: (?im)^#{1,6}\s*(?:issue\s+)?type\s*$\n+\s*(?:bug|feature(?:\s+request)?|needs?\s+more\s+info(?:rmation)?)\s*$
    flags: ''
    replacement: ''
