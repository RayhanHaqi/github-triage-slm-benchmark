    flags: ''
    replacement: ''
  - pattern: \n{4,}
    flags: ''
    replacement: '



      '
  whitespace_pattern: \s+
  duplicate_key_lowercase: true
split:
  train_ratio: 0.8
  val_ratio: 0.9
  temporal_key: created_at
  seed: 42
model:
