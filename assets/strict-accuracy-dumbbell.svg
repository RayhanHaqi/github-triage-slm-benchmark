<rect x="16" y="624" width="948" height="64" rx="6" fill="#fff8c5"/><rect x="16" y="624" width="3" height="64" rx="1.5" fill="#bf8700"/><text x="32" y="644" font-size="11.5" fill="#4d2d00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">Do not rank across tracks.</tspan> BF16 LoRA and QLoRA NF4 differ in precision, checkpoint-selection policy and provenance.</text><text x="32" y="660" font-size="11.5" fill="#4d2d00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Matches hold only base vs fine-tuned within one configuration; no bigger-is-better implication is made for model size or parameter count.</text><text x="32" y="676" font-size="11.5" fill="#4d2d00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Single runs on a frozen 200-row holdout: differences are descriptive, not statistically significant.</text>
