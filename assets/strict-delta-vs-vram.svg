<svg xmlns="http://www.w3.org/2000/svg" width="980" height="624" viewBox="0 0 980 624" role="img" aria-labelledby="scatter-title" aria-describedby="scatter-desc">
<title id="scatter-title">Strict accuracy delta versus fine-tuned evaluation peak VRAM</title>
<desc id="scatter-desc">Scatter plot of strict accuracy delta in percentage points against fine-tuned evaluation peak reserved VRAM in GiB for ten configurations across two tracks. Descriptive and non-causal.</desc>
