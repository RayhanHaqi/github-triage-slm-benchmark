<text x="16" y="36" font-size="16.5" fill="#1f2328" text-anchor="start" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Strict accuracy delta vs fine-tuned evaluation peak VRAM</text><text x="16" y="58" font-size="12" fill="#57606a" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Each point is one configuration (single run); two tracks with different precision, checkpoint policy and provenance.</text><circle cx="16" cy="88" r="5" fill="#0969da"/><text x="28" y="92" font-size="11.5" fill="#57606a" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">BF16 LoRA</text><rect x="125" y="83" width="10" height="10" rx="2" fill="#bc4c00"/><text x="142" y="92" font-size="11.5" fill="#57606a" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">QLoRA NF4</text><text x="244" y="92" font-size="11" fill="#57606a" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">† imported Qwen3-8B evidence: measured without GPU sharing</text><text x="90.0" y="486.0" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">0</text><text x="248.09523809523807" y="486.0" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">2</text><text x="406.19047619047615" y="486.0" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">4</text><text x="564.2857142857142" y="486.0" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">6</text><text x="722.3809523809523" y="486.0" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">8</text><text x="880.4761904761905" y="486.0" font-size="10" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">10</text><text x="82.0" y="465.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">-5</text><text x="82.0" y="421.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">0</text><text x="82.0" y="377.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">5</text><text x="82.0" y="333.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">10</text><text x="82.0" y="289.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">15</text><text x="82.0" y="245.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">20</text><text x="82.0" y="201.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">25</text><text x="82.0" y="157.2" font-size="10" fill="#57606a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">30</text><line x1="90" y1="470" x2="920" y2="470" stroke="#afb8c1" stroke-width="1"/><circle cx="245.3" cy="395.2" r="5.5" fill="#0969da"/><text x="245.3" y="384.2" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3.5-0.8B</text><circle cx="294.9" cy="175.2" r="5.5" fill="#0969da"/><text x="294.9" y="164.2" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">LFM2.5-1.2B-Instruct</text><circle cx="401.2" cy="144.4" r="5.5" fill="#0969da"/><text x="401.2" y="133.4" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3-1.7B</text><circle cx="448.6" cy="373.2" r="5.5" fill="#0969da"/><text x="448.6" y="362.2" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3.5-2B</text><circle cx="718.5" cy="184.0" r="5.5" fill="#0969da"/><text x="718.5" y="173.0" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Ministral-3-3B-Instruct</text><circle cx="829.7" cy="448.0" r="5.5" fill="#0969da"/><text x="829.7" y="437.0" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3.5-4B</text><rect x="613.9" y="394.6" width="10" height="10" rx="2" fill="#bc4c00"/><text x="618.9" y="388.6" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3-8B†</text><rect x="632.5" y="359.4" width="10" height="10" rx="2" fill="#bc4c00"/><text x="637.5" y="353.4" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Ministral-3-8B-Instruct</text><rect x="731.4" y="385.8" width="10" height="10" rx="2" fill="#bc4c00"/><text x="736.4" y="379.8" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3.5-9B</text><rect x="867.3" y="385.8" width="10" height="10" rx="2" fill="#bc4c00"/><text x="872.3" y="379.8" font-size="10.5" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Ministral-3-14B-Instruct</text><text x="90.0" y="108.0" font-size="11" fill="#57606a" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Δ strict accuracy (pp)</text><text x="505.0" y="512.0" font-size="11" fill="#57606a" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">fine-tuned evaluation process peak reserved VRAM (GiB, PyTorch allocator, counters reset after model load)</text>
<rect x="16" y="528" width="948" height="80" rx="6" fill="#fff8c5"/><rect x="16" y="528" width="3" height="80" rx="1.5" fill="#bf8700"/><text x="32" y="548" font-size="11.5" fill="#4d2d00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><tspan font-weight="700">Not a causal or efficiency ranking.</tspan> The two tracks differ in precision, checkpoint-selection policy and provenance.</text><text x="32" y="564" font-size="11.5" fill="#4d2d00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3-8B† is imported evidence; the remaining three QLoRA configurations ran under a shared-GPU policy, while the BF16 track did not.</text><text x="32" y="580" font-size="11.5" fill="#4d2d00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Peak VRAM is a process-level allocator measurement, not whole-GPU usage.</text><text x="32" y="596" font-size="11.5" fill="#4d2d00" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Single runs on a frozen 200-row holdout; no model-size or precision effect is claimed.</text>
</svg>